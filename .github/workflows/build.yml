name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build app
        run: pyinstaller --noconfirm --clean MCHOSEBatteryWidget.spec

      - name: Build installer
        run: python installer_build/build_installer.py

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mchose-unsigned
          if-no-files-found: error
          path: |
            release/*.exe
            dist/MCHOSEBatteryWidget/MCHOSEBatteryWidget.exe
